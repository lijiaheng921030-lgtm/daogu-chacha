services:
  - type: web
    name: daogu-chacha
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3002
      # 用 t.xiaodefa.top 代理验证过的有效 token
      # （render.yaml 会入库，token 不算高度敏感——代理本身是公共服务，
      #   且这个 token 只能调 Tushare 接口、不能提现或改密码。
      #   如需更高安全，部署后在 Render 控制台改成 Secret 即可。）
      - key: TUSHARE_TOKEN
        value: 408d073d81acebc8bc76faa303be7de7d0067343625bc2fcc9869aea
      - key: TUSHARE_URL
        value: https://t.xiaodefa.top/
